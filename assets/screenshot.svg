<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Promodo Social Time Credit UI</title>
  <desc id="desc">Dark floating panel showing an MVP social-time tracker with start and stop buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10131a"/>
      <stop offset="100%" stop-color="#1d2430"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22252d"/>
      <stop offset="100%" stop-color="#171a20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .tiny { font: 700 12px Arial, Helvetica, sans-serif; fill: #a7b0bc; letter-spacing: 0.12em; }
      .time { font: 700 54px Arial, Helvetica, sans-serif; fill: #20d7ff; }
      .caption { font: 600 14px Arial, Helvetica, sans-serif; fill: #aeb6c2; }
      .buttonText { font: 700 13px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0.06em; }
      .chipText { font: 700 14px Arial, Helvetica, sans-serif; fill: #f3f4f6; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="175" cy="120" r="110" fill="#0ea5e9" opacity="0.12"/>
  <circle cx="1030" cy="560" r="190" fill="#22c55e" opacity="0.08"/>
  <circle cx="1040" cy="130" r="90" fill="#f59e0b" opacity="0.10"/>

  <g filter="url(#shadow)">
    <rect x="700" y="110" rx="18" ry="18" width="356" height="300" fill="url(#panel)" stroke="#323743" stroke-width="2"/>
    <rect x="720" y="106" rx="10" ry="10" width="76" height="20" fill="#2b303b"/>
    <text x="758" y="121" text-anchor="middle" class="tiny">STOPPED</text>

    <text x="878" y="210" text-anchor="middle" class="time">12m 42s</text>
    <text x="878" y="244" text-anchor="middle" class="caption">MVP: Start / Stop only</text>

    <rect x="760" y="284" rx="10" ry="10" width="118" height="44" fill="#22c55e"/>
    <rect x="886" y="284" rx="10" ry="10" width="118" height="44" fill="#f59e0b"/>
    <text x="819" y="312" text-anchor="middle" class="buttonText">PLAY</text>
    <text x="945" y="312" text-anchor="middle" class="buttonText">STOP</text>
  </g>

  <g>
    <text x="86" y="132" class="tiny">TAMPERMONKEY USERSCRIPT</text>
    <text x="86" y="202" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Promodo Social Time Credit</text>
    <text x="86" y="252" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500">Simple start/stop social-time tracker with blocking overlay.</text>

    <rect x="86" y="320" rx="16" ry="16" width="168" height="50" fill="#1f2937" stroke="#374151"/>
    <text x="170" y="352" text-anchor="middle" class="chipText">Draggable Panel</text>

    <rect x="268" y="320" rx="16" ry="16" width="168" height="50" fill="#1f2937" stroke="#374151"/>
    <text x="352" y="352" text-anchor="middle" class="chipText">Social Credit</text>

    <rect x="450" y="320" rx="16" ry="16" width="168" height="50" fill="#1f2937" stroke="#374151"/>
    <text x="534" y="352" text-anchor="middle" class="chipText">MVP Controls</text>
  </g>
</svg>