<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Promodo Social Time Credit UI</title>
  <desc id="desc">Dark floating panel showing a Pomodoro timer with mode selector, preset selector, and action buttons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10131a"/>
      <stop offset="100%" stop-color="#1d2430"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22252d"/>
      <stop offset="100%" stop-color="#171a20"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <style>
      .label { font: 600 16px Arial, Helvetica, sans-serif; fill: #cfd4dc; }
      .small { font: 600 13px Arial, Helvetica, sans-serif; fill: #9ca3af; }
      .tiny { font: 700 12px Arial, Helvetica, sans-serif; fill: #a7b0bc; letter-spacing: 0.12em; }
      .time { font: 700 54px Arial, Helvetica, sans-serif; fill: #20d7ff; }
      .buttonText { font: 700 13px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0.06em; }
      .chipText { font: 700 14px Arial, Helvetica, sans-serif; fill: #f3f4f6; }
    </style>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="175" cy="120" r="110" fill="#0ea5e9" opacity="0.12"/>
  <circle cx="1030" cy="560" r="190" fill="#22c55e" opacity="0.08"/>
  <circle cx="1040" cy="130" r="90" fill="#f59e0b" opacity="0.10"/>

  <g filter="url(#shadow)">
    <rect x="700" y="86" rx="18" ry="18" width="356" height="400" fill="url(#panel)" stroke="#323743" stroke-width="2"/>
    <rect x="720" y="106" rx="10" ry="10" width="76" height="20" fill="#2b303b"/>
    <text x="758" y="121" text-anchor="middle" class="tiny">STOPPED</text>

    <text x="878" y="194" text-anchor="middle" class="time">30m 00s</text>

    <text x="724" y="244" class="label">Mode</text>
    <rect x="724" y="254" rx="8" ry="8" width="308" height="34" fill="#303542" stroke="#4b5563"/>
    <text x="740" y="276" class="small">Social Credit (Hybrid)</text>
    <polygon points="1010,268 1022,268 1016,278" fill="#cfd4dc"/>

    <text x="724" y="314" class="label">Preset</text>
    <rect x="724" y="324" rx="8" ry="8" width="308" height="34" fill="#303542" stroke="#4b5563"/>
    <text x="740" y="346" class="small">Focus 30m</text>
    <polygon points="1010,338 1022,338 1016,348" fill="#cfd4dc"/>

    <rect x="724" y="378" rx="10" ry="10" width="88" height="44" fill="#22c55e"/>
    <rect x="820" y="378" rx="10" ry="10" width="88" height="44" fill="#f59e0b"/>
    <rect x="916" y="378" rx="10" ry="10" width="88" height="44" fill="#ef4444"/>
    <text x="768" y="406" text-anchor="middle" class="buttonText">PLAY</text>
    <text x="864" y="406" text-anchor="middle" class="buttonText">STOP</text>
    <text x="960" y="406" text-anchor="middle" class="buttonText">RESET</text>
  </g>

  <g>
    <text x="86" y="132" class="tiny">TAMPERMONKEY USERSCRIPT</text>
    <text x="86" y="202" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Promodo Social Time Credit</text>
    <text x="86" y="252" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="500">Hybrid focus timer with draggable controls and social-site blocking.</text>

    <rect x="86" y="320" rx="16" ry="16" width="168" height="50" fill="#1f2937" stroke="#374151"/>
    <text x="170" y="352" text-anchor="middle" class="chipText">Draggable Panel</text>

    <rect x="268" y="320" rx="16" ry="16" width="168" height="50" fill="#1f2937" stroke="#374151"/>
    <text x="352" y="352" text-anchor="middle" class="chipText">Social Credit</text>

    <rect x="450" y="320" rx="16" ry="16" width="168" height="50" fill="#1f2937" stroke="#374151"/>
    <text x="534" y="352" text-anchor="middle" class="chipText">Pomodoro Timer</text>
  </g>
</svg>